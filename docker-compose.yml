services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: gestao_pessoas
      POSTGRES_USER: gestao
      POSTGRES_PASSWORD: gestao_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestao -d gestao_pessoas"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
